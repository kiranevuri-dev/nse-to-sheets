name: NSE Bhavcopy to Google Sheets

on:
  schedule:
    # ప్రతిరోజూ సోమవారం నుండి శుక్రవారం వరకు సాయంత్రం 5:30 PM IST (12:00 UTC) కు రన్ అవుతుంది
    - cron: '30 12 * * 1-5'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Python Script
        env:
          GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDS }}
        run: |
          python main.py
